name: Bug Report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error output
      description: Paste any tracebacks or console output. This will be rendered as code, no need for backticks.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Which commit or version are you running?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (browser, OS, deployment environment, etc.)
