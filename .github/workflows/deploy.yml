name: Deploy

# Only fires after the CI workflow completes successfully on main — never
# deploys unreviewed/untested code, and never deploys a branch other than
# main. Requires three repo secrets to actually do anything (VPS_HOST,
# VPS_USER, VPS_SSH_KEY) plus GIT_REPO_URL — until those exist, this
# workflow is correct but inert. See docs/CI_CD.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export GIT_REPO_URL="${{ secrets.GIT_REPO_URL }}"
            export GIT_REF="main"
            sudo -u deploy -E bash /srv/shoporbit/scripts/deploy.sh
