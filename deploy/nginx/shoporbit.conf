# Nginx site config for shoporbit.
#
# Replace every occurrence of `shoporbit.example` below with your real
# domain, and `/srv/shoporbit` with wherever scripts/install_server.sh
# put the release tree, before installing this file. See docs/DEPLOYMENT.md
# for the full walkthrough (this file is installed to
# /etc/nginx/sites-available/shoporbit and symlinked into
# sites-enabled by install_server.sh).
#
# TLS certificate paths (ssl_certificate/ssl_certificate_key) are left for
# `certbot --nginx` to fill in — see scripts/renew_ssl.sh and
# docs/DEPLOYMENT.md. Nothing in this file works over HTTPS until Certbot
# has run once.

# Basic rate limiting on dynamic (non-static) requests — a shared 10MB zone
# is enough headroom for a small storefront; raise if legitimate traffic
# ever trips it (check nginx's error log for "limiting requests" first).
limit_req_zone $binary_remote_addr zone=shoporbit_dynamic:10m rate=10r/s;

# Real client IP when Nginx itself sits behind another proxy/CDN — safe to
# leave as-is if Nginx is the first hop (the default), harmless otherwise.
real_ip_header X-Forwarded-For;

server {
    listen 80;
    listen [::]:80;
    server_name shoporbit.example www.shoporbit.example;

    # Certbot's ACME HTTP-01 challenge needs to be reachable over plain
    # HTTP even after HTTPS is enforced everywhere else.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Combined listen+http2 syntax (rather than the newer split `http2 on;`
    # directive) for compatibility with the Nginx version Ubuntu 24.04's
    # apt repository actually ships — check `nginx -v` and switch to
    # `listen 443 ssl; http2 on;` if you're on Nginx >= 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shoporbit.example www.shoporbit.example;

    # Filled in by `certbot --nginx` — see scripts/renew_ssl.sh.
    ssl_certificate /etc/letsencrypt/live/shoporbit.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shoporbit.example/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Security headers. Django's own SecurityMiddleware (see
    # config/settings/production.py) sets X-Content-Type-Options,
    # X-Frame-Options, and Referrer-Policy on responses it generates —
    # these are set here too so they also apply to static files Nginx
    # serves directly, which never pass through Django.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # Deliberately permissive on script-src/style-src (HTMX/Alpine use
    # inline attributes) — tightening this to a nonce-based policy is a
    # real follow-up, not done here; see docs/SECURITY.md.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

    access_log /var/log/nginx/shoporbit_access.log;
    error_log /var/log/nginx/shoporbit_error.log;

    # Filenames aren't content-hashed today, so this is a moderate cache
    # window, not `immutable` — a deployed static-file change won't be
    # visible to a returning browser until this expires. Worth revisiting
    # (e.g. Django's ManifestStaticFilesStorage) if that becomes a problem.
    location /static/ {
        alias /srv/shoporbit/current/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/shoporbit/shared/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        limit_req zone=shoporbit_dynamic burst=20 nodelay;

        proxy_pass http://unix:/run/shoporbit/gunicorn.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
