<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f8fafc;font-family:'Helvetica Neue',Arial,sans-serif;color:#0f172a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc;padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;">
<tr>
<td style="background-color:#0f172a;padding:22px 32px;">
<span style="color:#f8fafc;font-size:19px;letter-spacing:0.04em;font-weight:600;">{{ site_name }}</span>
</td>
</tr>
<tr>
<td style="padding:32px;font-size:15px;line-height:1.6;">
{% block content %}{% endblock %}
</td>
</tr>
<tr>
<td style="padding:18px 32px;background-color:#f1f5f9;color:#64748b;font-size:12px;">
{{ site_name }} &middot; <a href="https://{{ site_domain }}" style="color:#0369a1;text-decoration:none;">{{ site_domain }}</a>
</td>
</tr>
</table>
</td></tr>
</table>
</body>
</html>
