{% extends "admin/base_site.html" %}
{% load static %}

{% block extrastyle %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'css/admin_theme.css' %}">
{% endblock %}

{% block branding %}
    <div id="site-name">
        <a href="{% url 'admin:index' %}">
            {% if site.logo_url %}
                <img src="{{ site.logo_url }}" alt="{{ site.name }}" style="height: 28px; vertical-align: middle; margin-right: 8px;">
            {% endif %}
            {{ site_header }}
        </a>
    </div>
{% endblock %}
